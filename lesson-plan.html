<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SchoolOS - Lesson Plan Creator</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#075bea,#123b98);
    color:white;
    padding:25px 18px;
}

.header{
    max-width:900px;
    margin:auto;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.subtitle{
    margin-top:5px;
    opacity:.9;
}

.brand{
    margin-top:18px;
    font-size:14px;
}

main{
    max-width:900px;
    margin:auto;
    padding:20px 15px;
}

.card{
    background:white;
    padding:22px;
    border-radius:18px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

h1{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    margin-bottom:15px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccd5e3;
    border-radius:9px;
    font-size:15px;
}

textarea{
    min-height:110px;
    resize:vertical;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:9px;
    font-weight:bold;
    margin:5px;
    cursor:pointer;
}

.save{
    background:#075bea;
    color:white;
}

.print{
    background:#172033;
    color:white;
}

.clear{
    background:#e8edf5;
    color:#172033;
}

.message{
    margin-top:15px;
    padding:12px;
    background:#e9f8ee;
    color:#176b35;
    border-radius:8px;
    display:none;
}

footer{
    text-align:center;
    padding:25px;
    color:#687386;
    font-size:13px;
}

@media(max-width:650px){
    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .logo{
        font-size:25px;
    }
}

@media print{
    header,button,.message,footer{
        display:none;
    }

    body{
        background:white;
    }

    .card{
        box-shadow:none;
    }
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">🏫 SchoolOS</div>

<div class="subtitle">
📚 Lesson Plan Creator
</div>

<div class="brand">
<strong>Owned & Developed by Team of Tutors</strong><br>
0300-2627199
</div>

</div>
</header>


<main>

<div class="card">

<h1>📚 Create Lesson Plan</h1>

<p>
Create, save and print a professional lesson plan.
</p>

</div>


<div class="card">

<form id="planForm">

<div class="grid">

<div class="field">
<label>Grade / Class</label>
<input id="grade" placeholder="Example: Grade II" required>
</div>

<div class="field">
<label>Subject</label>
<input id="subject" placeholder="Example: Mathematics" required>
</div>

<div class="field">
<label>Topic</label>
<input id="topic" placeholder="Example: Addition" required>
</div>

<div class="field">
<label>Date</label>
<input id="date" type="date" required>
</div>

<div class="field">
<label>Duration</label>
<input id="duration" value="40 minutes">
</div>

<div class="field">
<label>Teaching Method</label>
<select id="method">
<option>Activity Based Learning</option>
<option>Discussion</option>
<option>Demonstration</option>
<option>Question & Answer</option>
<option>Group Work</option>
<option>Mixed Methods</option>
</select>
</div>

<div class="field full">
<label>🎯 Learning Objectives</label>
<textarea id="objectives" placeholder="What will students learn?"></textarea>
</div>

<div class="field full">
<label>🧠 Previous Knowledge</label>
<textarea id="previous" placeholder="What do students already know?"></textarea>
</div>

<div class="field full">
<label>👨‍🏫 Teaching Procedure</label>
<textarea id="procedure" placeholder="Describe the teaching process..."></textarea>
</div>

<div class="field full">
<label>👥 Student Activities</label>
<textarea id="activities" placeholder="Describe student activities..."></textarea>
</div>

<div class="field full">
<label>📝 Assessment</label>
<textarea id="assessment" placeholder="How will students be assessed?"></textarea>
</div>

<div class="field full">
<label>🏠 Homework</label>
<textarea id="homework" placeholder="Enter homework..."></textarea>
</div>

</div>


<button type="submit" class="save">
💾 Save Lesson Plan
</button>

<button type="button" class="print" onclick="window.print()">
🖨️ Print / PDF
</button>

<button type="button" class="clear" onclick="clearForm()">
🔄 New Plan
</button>

<div id="message" class="message">
✅ Lesson Plan saved successfully on this device.
</div>

</form>

</div>


<div class="card">

<h2>📂 Saved Lesson Plans</h2>

<div id="saved"></div>

</div>

</main>


<footer>

SchoolOS © 2026

<br><br>

Owned & Developed by <strong>Team of Tutors</strong>

<br>

0300-2627199

</footer>


<script>

var form = document.getElementById("planForm");
var saved = document.getElementById("saved");
var message = document.getElementById("message");

document.getElementById("date").value =
new Date().toISOString().split("T")[0];


function loadPlans(){

    var plans =
    JSON.parse(localStorage.getItem("schoolos_plans") || "[]");

    if(plans.length === 0){
        saved.innerHTML = "<p>No saved plans yet.</p>";
        return;
    }

    saved.innerHTML = "";

    plans.forEach(function(plan,index){

        var item = document.createElement("div");

        item.className = "card";

        item.innerHTML =
        "<strong>" +
        plan.grade +
        " - " +
        plan.subject +
        "</strong><br>" +
        "Topic: " +
        plan.topic +
        "<br>" +
        "Date: " +
        plan.date +
        "<br><br>" +
        "<button class='clear' onclick='deletePlan(" +
        index +
        ")'>🗑️ Delete</button>";

        saved.appendChild(item);

    });
}


form.addEventListener("submit",function(e){

    e.preventDefault();

    var plans =
    JSON.parse(localStorage.getItem("schoolos_plans") || "[]");

    var plan = {

        grade:document.getElementById("grade").value,

        subject:document.getElementById("subject").value,

        topic:document.getElementById("topic").value,

        date:document.getElementById("date").value,

        duration:document.getElementById("duration").value,

        method:document.getElementById("method").value,

        objectives:document.getElementById("objectives").value,

        previous:document.getElementById("previous").value,

        procedure:document.getElementById("procedure").value,

        activities:document.getElementById("activities").value,

        assessment:document.getElementById("assessment").value,

        homework:document.getElementById("homework").value

    };

    plans.push(plan);

    localStorage.setItem(
        "schoolos_plans",
        JSON.stringify(plans)
    );

    message.style.display = "block";

    loadPlans();

});


function deletePlan(index){

    var plans =
    JSON.parse(localStorage.getItem("schoolos_plans") || "[]");

    plans.splice(index,1);

    localStorage.setItem(
        "schoolos_plans",
        JSON.stringify(plans)
    );

    loadPlans();

}


function clearForm(){

    form.reset();

    document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

    message.style.display = "none";

}


loadPlans();

</script>

</body>
</html>
