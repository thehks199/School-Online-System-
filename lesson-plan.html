<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SchoolOS — Lesson Plan Creator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: linear-gradient(135deg, #0b5cff, #123c9b);
            color: white;
            padding: 22px;
        }

        .header {
            max-width: 1000px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
        }

        .tagline {
            font-size: 13px;
            opacity: .9;
            margin-top: 4px;
        }

        .developer {
            text-align: right;
            font-size: 13px;
            line-height: 1.5;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 25px 16px;
        }

        .top {
            background: white;
            padding: 28px;
            border-radius: 22px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,.06);
        }

        .badge {
            display: inline-block;
            background: #e8f0ff;
            color: #0b5cff;
            padding: 7px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
        }

        h1 {
            margin: 14px 0 8px;
        }

        .top p {
            color: #667085;
            line-height: 1.6;
        }

        .form-card {
            background: white;
            padding: 28px;
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(0,0,0,.06);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #d7deea;
            border-radius: 10px;
            padding: 12px;
            font: inherit;
            background: white;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #0b5cff;
            box-shadow: 0 0 0 3px rgba(11,92,255,.1);
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 22px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary {
            background: #0b5cff;
            color: white;
        }

        .secondary {
            background: #e9eef7;
            color: #172033;
        }

        .danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .saved {
            margin-top: 25px;
        }

        .saved-item {
            background: #f8fafc;
            border: 1px solid #e1e7ef;
            border-radius: 14px;
            padding: 16px;
            margin-top: 10px;
        }

        .saved-item strong {
            font-size: 17px;
        }

        .saved-item small {
            display: block;
            color: #667085;
            margin-top: 5px;
        }

        footer {
            text-align: center;
            padding: 30px 15px;
            color: #68758a;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .header {
                display: block;
            }

            .developer {
                text-align: left;
                margin-top: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }

        @media print {
            header,
            .buttons,
            .saved,
            footer {
                display: none;
            }

            body {
                background: white;
            }

            .form-card,
            .top {
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <div>
            <div class="logo">🏫 SchoolOS</div>

            <div class="tagline">
                Teacher Tools
            </div>
        </div>

        <div class="developer">
            <strong>Owned & Developed by</strong><br>
            Team of Tutors<br>
            0300-2627199
        </div>

    </div>
</header>
